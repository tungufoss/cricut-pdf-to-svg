# Publish report/ to GitHub Pages. CI has no template PDF, so the site is built from the
# committed edge table in report/data/ (`make report-data`); the traced sheets stay local.
name: Publish Quarto site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - 'data/**'
      - 'report/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::yaml
            any::dplyr
            any::forcats
            any::ggplot2
            any::purrr
            any::readr
            any::scales
            any::stringr
            any::tibble
            any::tidyr
            any::xml2
            any::DT

      - name: Render site
        run: quarto render report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: report/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
